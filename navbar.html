<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Navbar</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* Navbar */

nav{

    display:flex;

    background:#2f8d46;

    color:white;

    padding:15px;
}

/* Each Menu */

.menu{

    position:relative;

    margin-right:40px;

    cursor:pointer;
}

.menu p{

    padding:10px;
}

/* Dropdown */

.sub{

    display:none;

    position:absolute;

    top:40px;

    left:0;

    background:white;

    color:black;

    min-width:180px;

    box-shadow:0 0 10px gray;
}

.sub p{

    padding:10px;

    border-bottom:1px solid lightgray;
}

.sub p:hover{

    background:lightgreen;
}

/* Show Dropdown */

.menu:hover .sub{

    display:block;
}

.menu:hover{

    color:yellow;
}
    </style>
</head>

<body>

<nav>

    <div class="menu">
        <p>COURSES</p>

        <div class="sub">
            <p>HTML</p>
            <p>CSS</p>
            <p>React</p>
            <p>Python</p>
        </div>
    </div>

    <div class="menu">
        <p>TUTORIALS</p>

        <div class="sub">
            <p>HTML</p>
            <p>CSS</p>
            <p>Python</p>
            <p>React</p>
        </div>
    </div>

    <div class="menu">
        <p>INTERVIEW PREPARATION</p>

        <div class="sub">
            <p>Interview Tips</p>
            <p>Practice DSA</p>
            <p>Problem of the Day</p>
            <p>Mock Interviews</p>
        </div>
    </div>

</nav>

</body>
</html>
